[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-triage-engine"
version = "0.1.0"
description = "Turns noisy CI results into one confident PR-readiness verdict, and posts it without spamming the thread."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["prtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
